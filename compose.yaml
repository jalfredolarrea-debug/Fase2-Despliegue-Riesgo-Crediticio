services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fase2-riesgo-api:v2
    ports:
      - "127.0.0.1:8765:8000"
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: fase2-riesgo-frontend:v1
    ports:
      - "127.0.0.1:8766:8501"
    mem_limit: 1g
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 15s
